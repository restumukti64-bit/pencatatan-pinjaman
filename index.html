<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pencatatan Pinjaman</title>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
   <!-- TAMBAHKAN BARIS INI: -->
   <link rel="stylesheet" href="style.css">
    <!-- Supabase JS Client (Wajib dimuat sebelum app.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-[#F8F9FA] text-slate-900 pb-20">

    <!-- Header & Dashboard Total -->
    <header class="bg-gradient-to-b from-blue-600 to-blue-500 rounded-b-[2rem] pt-8 pb-16 px-6 text-center text-white shadow-md relative">
        <p class="text-sm font-medium opacity-90 mb-2">Total Pinjaman Aktif</p>
        <h1 id="dashboard-total" class="text-4xl font-extrabold tracking-tight">Rp 0</h1>
        
        <!-- Tombol Tambah Transaksi -->
        <button onclick="openModal('modal-add-initial')" class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 bg-white text-blue-600 font-bold py-3 px-8 rounded-full shadow-lg hover:shadow-xl transition-all border border-blue-50 flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Tambah Transaksi
        </button>
    </header>

    <!-- Main Feed (List Kartu Peminjam) -->
    <main class="mt-14 px-4 max-w-md mx-auto space-y-4" id="card-container">
        <p class="text-center text-slate-500 text-sm mt-10">Belum ada data pinjaman aktif.</p>
    </main>

    <!-- Modal Tambah Transaksi Awal -->
    <div id="modal-add-initial" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <h2 class="text-xl font-bold mb-4">Transaksi Baru</h2>
            <form id="form-add-initial" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Peminjam</label>
                    <input type="text" id="input-name" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nominal (Rp)</label>
                    <input type="text" id="input-amount" required placeholder="0" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg font-bold">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Alasan</label>
                    <textarea id="input-reason" required rows="2" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Jatuh Tempo</label>
                    <input type="date" id="input-date" required class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal('modal-add-initial')" class="flex-1 py-2 rounded-lg font-semibold text-slate-500 bg-slate-100 hover:bg-slate-200">Batal</button>
                    <button type="submit" class="flex-1 py-2 rounded-lg font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Detail & Aksi -->
    <div id="modal-detail" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <h2 id="detail-name" class="text-xl font-bold mb-1">Nama Peminjam</h2>
            <p id="detail-sisa" class="text-2xl font-extrabold text-blue-600 mb-6">Rp 0</p>
            
            <div class="flex flex-col gap-3">
                <button onclick="openActionModal('pay')" class="w-full py-3 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md transition-all">Bayar / Lunasi</button>
                <button onclick="openActionModal('add')" class="w-full py-3 rounded-xl font-bold text-blue-600 border-2 border-blue-600 hover:bg-blue-50 transition-all">Tambah Pinjaman</button>
                <button onclick="closeModal('modal-detail')" class="mt-2 text-sm font-semibold text-slate-400 hover:text-slate-600">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Form Aksi -->
    <div id="modal-action-form" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 relative">
            <h2 id="action-title" class="text-xl font-bold mb-4">Aksi</h2>
            <form id="form-action" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nominal (Rp)</label>
                    <input type="text" id="action-amount" required placeholder="0" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all text-lg font-bold">
                </div>
                <div id="action-reason-container">
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Alasan</label>
                    <textarea id="action-reason" rows="2" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"></textarea>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal('modal-action-form')" class="flex-1 py-2 rounded-lg font-semibold text-slate-500 bg-slate-100">Batal</button>
                    <button type="submit" id="action-submit-btn" class="flex-1 py-2 rounded-lg font-semibold text-white bg-blue-600 shadow-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Dimuat di akhir body -->
    <script src="app.js"></script>
</body>
</html>
